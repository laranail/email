version: 2
updates:

  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    groups:
      # codeql-action/init and /analyze MUST move together: CodeQL fails with
      # "Loaded a configuration file for version X, but running version Y" when
      # they differ, and dependabot proposes each subpath as its own pull
      # request -- so each one alone is red. Grouping keeps them in one commit.
      actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
