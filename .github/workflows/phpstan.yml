# Named `phpstan` for the badge's sake, but it runs the whole static leg — PHPStan, Pint and Rector —
# matching `laranail/phone`'s. Splitting them across workflows only means three places to notice a
# red tick.
#
# Rector runs in `--dry-run`. The `composer rector` script used to call `process`, which *applies*
# changes: on CI that is a check which can never fail, because it fixes whatever it found and exits 0.

name: phpstan

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phpstan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyse:
    name: PHPStan · Pint · Rector
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, intl, pdo_sqlite, sqlite3
          coverage: none

      - name: Resolve composer cache directory
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Restore composer cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('**/composer.json') }}
          restore-keys: composer-${{ runner.os }}-${{ matrix.php }}-

      - name: Drop cached laranail archives
        # laranail/* resolve through a single MOVING v0.1.0 tag, so composer's dist
        # cache is keyed on a name whose contents change underneath it. A restored
        # archive is then silently stale: the install reports success and unpacks
        # whatever was cached the first time. Everything else is immutable per
        # version and stays cached.
        # POSIX command via bash: Windows runners default to PowerShell, where this
        # would be a parse error rather than a no-op.
        shell: bash
        run: rm -rf "$(composer config cache-files-dir)/laranail"

      - name: Install dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        run: composer update --prefer-stable --no-interaction --no-progress

      - name: Validate the manifest
        run: composer validate --strict

      - name: PHPStan
        run: composer phpstan

      - name: Pint
        run: composer pint

      - name: Rector
        run: composer rector
